name: Deploy to GitHub Pages
on:
  workflow_run:
    workflows:
      - "Test ROCm - Core"
      - "Test ROCm - ROC-1"
      - "Test ROCm - ROC-2"
      - "Test ROCm - ROC-3"
      - "Test ROCm - HIP-1"
      - "Test ROCm - HIP-2"
      - "Test ROCm - HIP-3"
      - "Test ROCm - MISC"
      - "Test ROCm - COMM-ML"
      - "Test ROCm - Apps"
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch pinned issue content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e

          # Get pinned issue with test results
          ISSUE_BODY=$(gh issue view 1 \
            --json body \
            --jq '.body // empty')

          if [[ -z "$ISSUE_BODY" ]]; then
            echo "No issue found with labels 'generated,sources-test'. Using placeholder."
            exit 0
          fi

          # Convert LaTeX badges to HTML badges
          # Match: $${\color{green}\textbf{PASS}\space✅}$$ -> <span class="badge pass">PASS</span>
          # Match: $${\color{red}\textbf{FAIL}\space⭕}$$ -> <span class="badge fail">FAIL</span>
          echo "$ISSUE_BODY" | sed \
            -e 's/\$\$[^$]*PASS[^$]*\$\$/<span class="badge pass">PASS<\/span>/g' \
            -e 's/\$\$[^$]*FAIL[^$]*\$\$/<span class="badge fail">FAIL<\/span>/g' \
            > pages/content.md

          # Add front matter to create index.md
          {
            echo "---"
            echo "layout: default"
            echo "last_updated: \"$(date -u +'%Y-%m-%d %H:%M UTC')\""
            echo "---"
            echo ""
            echo "_Last test run: {{ page.last_updated }}_"
            echo ""
            cat pages/content.md
          } > pages/index.md

          rm pages/content.md

          echo "::group::Generated index.md"
          cat pages/index.md
          echo "::endgroup::"
      - name: Generate badge JSON files
        run: |
          set -e
          mkdir -p pages/badges

          # Extract package names from h2 headings
          packages=$(grep -E '^## ' pages/index.md | sed 's/^## //' || true)

          if [[ -z "$packages" ]]; then
            echo "No packages found in index.md"
            exit 0
          fi

          echo "Found packages:"
          echo "$packages"

          while IFS= read -r package; do
            # Skip empty lines
            [[ -z "$package" ]] && continue

            # Get the section for this package (from ## package to next ## or end)
            section=$(awk "/^## ${package}\$/{p=1} /^## /&&!/^## ${package}\$/{p=0} p" pages/index.md)

            # Determine status: FAIL if any test failed, PASS otherwise
            if echo "$section" | grep -q 'badge fail'; then
              status="FAIL"
              color="red"
            else
              status="PASS"
              color="green"
            fi

            # Create badge JSON
            cat > "pages/badges/${package}.json" << EOF
          {"schemaVersion":1,"label":"${package}","message":"${status}","color":"${color}"}
          EOF

            echo "Created badge for $package: $status"
          done <<< "$packages"

          echo "::group::Badge files"
          ls -la pages/badges/
          echo "::endgroup::"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Generate dependency graphs
        env:
          # Pinned commit of talhaHavadar/dotfiles containing dep-viz.
          # Bump this to pick up upstream changes to the visualiser.
          DEP_VIZ_SHA: 2a6ba6405cec28dcb9e515f055740b21e98d9723
          # Space-separated list of dist labels to render graphs for.
          # The special label "devel" is resolved to the current Ubuntu devel
          # codename via archive.ubuntu.com; other labels are used verbatim.
          DISTS: "devel resolute"
        run: |
          set -eo pipefail
          mkdir -p pages/graphs

          curl -sSfL \
            "https://raw.githubusercontent.com/talhaHavadar/dotfiles/${DEP_VIZ_SHA}/dot/bin/packaging/dep-viz" \
            -o dep-viz
          chmod +x dep-viz

          entries=()
          for label in $DISTS; do
            if [[ "$label" == "devel" ]]; then
              # No `exit` in awk: with `pipefail`, closing wget's stdout early
              # trips wget's File-I/O exit (3) and fails the step. The Release
              # file has exactly one `Codename:` line, so reading to EOF is safe.
              codename=$(wget -qO- http://archive.ubuntu.com/ubuntu/dists/devel/Release \
                | awk -F ': ' '$1 == "Codename" { print $2 }')
              if [[ -z "$codename" ]]; then
                echo "::warning::Could not resolve devel codename; skipping"
                continue
              fi
            else
              codename="$label"
            fi

            echo "::group::Generating dependency graph for ${label} (${codename})"
            # --json emits the build_order structure on stdout while still
            # writing the HTML file to disk. A trailing "[SUCCESS] ..." line
            # follows the JSON payload, so slice from the first '{' to the
            # last '}' to isolate the JSON blob ([SUCCESS] contains no '}').
            if ./dep-viz --package-set rocm --dist "$codename" \
                 --format html --mode source --json \
                 --output "pages/graphs/${codename}" \
               | python3 -c "import sys,json; d=sys.stdin.read(); i,j=d.find('{'),d.rfind('}'); assert i>=0 and j>i, 'no JSON in dep-viz output'; json.dump(json.loads(d[i:j+1]), sys.stdout, separators=(',',':'))" \
               > "pages/graphs/${codename}.json"; then
              entries+=("{\"label\":\"${label}\",\"codename\":\"${codename}\"}")
            else
              echo "::warning::Failed to generate graph for ${codename}"
              rm -f "pages/graphs/${codename}.json"
            fi
            echo "::endgroup::"
          done

          # Emit the tab manifest consumed by pages/dependency-graph.html
          (IFS=,; printf '[%s]\n' "${entries[*]}") > pages/graphs/dists.json

          echo "::group::Graph manifest"
          cat pages/graphs/dists.json
          ls -la pages/graphs/
          echo "::endgroup::"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
